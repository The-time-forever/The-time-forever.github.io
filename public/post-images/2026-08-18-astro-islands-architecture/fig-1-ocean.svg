<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="280" fill="#fafaf9"/>
  <text x="40" y="40" fill="#1c1917" font-size="14" font-weight="600">页面 = 海洋 + 岛屿</text>
  <text x="40" y="58" fill="#78716c" font-size="11">海面是静态 HTML；岛屿是带 client:* 指令的可交互组件</text>
  <rect x="40" y="80" width="720" height="160" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1"/>
  <text x="60" y="105" fill="#a8a29e" font-size="10" font-style="italic">header / article / footer</text>
  <text x="60" y="120" fill="#a8a29e" font-size="10" font-style="italic">零 JS · 零水合</text>
  <line x1="220" y1="90" x2="220" y2="230" stroke="#e7e5e4" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="240" y="100" width="120" height="30" fill="#fff" stroke="#1c1917" stroke-width="1.5"/>
  <text x="300" y="120" fill="#1c1917" font-size="11" text-anchor="middle" font-weight="500">client:load</text>
  <rect x="240" y="150" width="120" height="30" fill="#fff" stroke="#1c1917" stroke-width="1.5"/>
  <text x="300" y="170" fill="#1c1917" font-size="11" text-anchor="middle" font-weight="500">client:idle</text>
  <rect x="240" y="200" width="120" height="30" fill="#fff" stroke="#1c1917" stroke-width="1.5"/>
  <text x="300" y="220" fill="#1c1917" font-size="11" text-anchor="middle" font-weight="500">client:visible</text>
  <line x1="380" y1="90" x2="380" y2="230" stroke="#e7e5e4" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="400" y="100" width="160" height="60" fill="#fff" stroke="#78716c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="480" y="118" fill="#44403c" font-size="11" text-anchor="middle" font-weight="500">server:defer</text>
  <text x="480" y="135" fill="#a8a29e" font-size="10" text-anchor="middle">fallback 占位</text>
  <text x="480" y="148" fill="#a8a29e" font-size="10" text-anchor="middle">→ 延后服务端渲染</text>
  <rect x="400" y="180" width="160" height="50" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
  <text x="480" y="201" fill="#78716c" font-size="11" text-anchor="middle" font-weight="500">ClientRouter（可选）</text>
  <text x="480" y="216" fill="#a8a29e" font-size="10" text-anchor="middle">SPA 导航 / 视图过渡</text>
  <line x1="580" y1="90" x2="580" y2="230" stroke="#e7e5e4" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="600" y="135" fill="#a8a29e" font-size="10" font-style="italic">pure HTML</text>
  <text x="600" y="150" fill="#a8a29e" font-size="10" font-style="italic">articles…</text>
  <text x="600" y="200" fill="#a8a29e" font-size="10" font-style="italic">footer</text>
</svg>
